name: hard-gate

# The catalog's SDK-free hard gate + supply-chain job as ONE reusable workflow, so the sweep
# what would otherwise be N repo edits becomes a version bump of a single `uses:` ref. A consuming repo
# calls it from its own `.github/workflows/ci.yaml`:
#
#   jobs:
#     gate:
#       uses: portable-genai/hex-service-template/.github/workflows/hard-gate.yaml@v0.0.1
#       with:
#         python-versions: '["3.12", "3.13"]'
#         run-eval: true
#         dev-lockfile: requirements-dev.lock
#         runtime-lockfile: requirements-gcp.lock
#
# (For this to resolve, publish `hard-gate.yaml` under `.github/workflows/` of whichever repo
# hosts it, and allow it to be accessed by the owner's other repositories in that repo's
# Actions settings. This file lives here as the canonical source; copy it into the host repo's
# `.github/workflows/` at release.)
#
# Both lockfile inputs default to empty so a repo that has not yet compiled its locks keeps the
# older extras-based install. Every repo rendered from the template passes them, which makes the
# install reproducible (practices check D1) and lets pip-audit judge EXACTLY the versions CI and
# the container image install rather than a fresh resolve nobody ships.

on:
  workflow_call:
    inputs:
      python-versions:
        description: "JSON array of Python versions for the test matrix."
        type: string
        default: '["3.12", "3.13"]'
      run-eval:
        description: "Run `python eval/run_eval.py` as part of the gate."
        type: boolean
        default: true
      eval-command:
        description: "The eval command (smoke mode) run when run-eval is true."
        type: string
        default: "python eval/run_eval.py"
      dev-lockfile:
        description: "Committed dev lockfile. Empty falls back to `pip install -e .[dev]`."
        type: string
        default: ""
      runtime-lockfile:
        description: "Committed runtime/cloud lockfile, audited alongside the dev lockfile."
        type: string
        default: ""
      iap-matrix-path:
        description: >-
          The IAP negative-matrix test module. Empty (the default) skips that job entirely, so a
          repo that predates the module keeps the old gate; repos rendered from the template
          pass "tests/unit/test_iap_crypto_matrix.py". The environment prefix the module's
          require-flag needs is READ OUT OF THE REPO (.env.example), not passed in: workflow
          files are copied without rendering, so a per-repo literal here would be hand-written
          and wrong exactly once.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: hard-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (locked when a lockfile is declared)
        env:
          DEV_LOCKFILE: ${{ inputs.dev-lockfile }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -n "$DEV_LOCKFILE" ]; then
            # --no-deps on the project itself keeps the lockfile authoritative: nothing is
            # re-resolved, so CI installs exactly what the image installs.
            pip install -r "$DEV_LOCKFILE"
            pip install --no-deps -e .
          else
            pip install -e ".[dev]"
          fi

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      - name: Mypy (type-check, strict)
        run: mypy src

      - name: Pytest (unit + contract, no integration)
        run: pytest -m 'not integration'

      - name: Eval gate (offline smoke)
        if: ${{ inputs.run-eval }}
        run: ${{ inputs.eval-command }}

  iap-verifier:
    name: IAP negative matrix (runtime lockfile)
    # The offline gate above is SDK-free by design, so google-auth is not importable there and
    # the negative matrix for the IAP identity adapter would skip. That adapter is the only one
    # that declares it VERIFIES the end user, and that declaration is what stands the loopback
    # exposure guard down, so "the one adapter nobody tests" is not an acceptable state. This job
    # installs the runtime lockfile (which pins google-auth and cryptography) and runs the matrix
    # with the require flag ON, so a missing verifier is an ERROR rather than a silent skip.
    # It stays offline: the key is minted in-process and the key-set fetch is served in-process.
    if: ${{ inputs.runtime-lockfile != '' && inputs.iap-matrix-path != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the runtime lockfile
        env:
          RUNTIME_LOCKFILE: ${{ inputs.runtime-lockfile }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r "$RUNTIME_LOCKFILE"
          pip install --no-deps -e .
          pip install pytest
      - name: Pytest (IAP negative matrix, required)
        env:
          MATRIX_PATH: ${{ inputs.iap-matrix-path }}
        run: |
          set -euo pipefail
          # The prefix comes out of the repo, so no workflow file carries a per-repo literal.
          PREFIX="$(python -c '
          import pathlib, re, sys
          text = pathlib.Path(".env.example").read_text()
          match = re.search(r"^([A-Z0-9]+)_PROFILE=", text, re.M)
          if not match:
              sys.exit("no <PREFIX>_PROFILE= line in .env.example")
          print(match.group(1))
          ')"
          # -rs prints the skip reasons; the grep below fails the job on any skip, because a
          # skipped negative matrix in the job that exists to run it is a green tick over
          # nothing. `tee` keeps the output visible as well as inspectable.
          env "${PREFIX}_REQUIRE_IAP_MATRIX=1" \
            pytest --no-header -rs "$MATRIX_PATH" | tee /tmp/iap.log
          if grep -qE 'skipped|no tests ran' /tmp/iap.log; then
            echo "the IAP negative matrix skipped where google-auth is installed" >&2
            exit 1
          fi

  supply-chain:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # A HARD gate, not advisory: no continue-on-error, so a known-vulnerable dependency fails
    # the run and blocks the merge exactly like a failing test.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        env:
          DEV_LOCKFILE: ${{ inputs.dev-lockfile }}
          RUNTIME_LOCKFILE: ${{ inputs.runtime-lockfile }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pip-audit
          if [ -n "$DEV_LOCKFILE" ]; then
            # --no-deps: the lockfiles are fully compiled (every transitive dependency pinned),
            # so audit exactly those versions instead of re-resolving something nobody ships.
            pip-audit -r "$DEV_LOCKFILE" --disable-pip --no-deps
            if [ -n "$RUNTIME_LOCKFILE" ]; then
              pip-audit -r "$RUNTIME_LOCKFILE" --disable-pip --no-deps
            fi
          else
            pip install -e ".[dev]"
            pip-audit
          fi
